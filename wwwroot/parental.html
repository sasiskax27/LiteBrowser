<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Сайт недоступен</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .card { max-width: 520px; margin: 24px; padding: 36px 34px 30px; text-align: center; background: var(--card);
          border: 1px solid var(--line); border-radius: 24px; backdrop-filter: blur(14px); }
  .ic { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; font-size: 34px;
        color: var(--accent); background: rgba(var(--accent-rgb),.12); }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: var(--dim); font-size: 14px; line-height: 1.6; margin: 0 0 8px; }
  .host { color: var(--text); font-weight: 600; word-break: break-all; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="ic icon">&#xE72E;</div>
  <h1>Этот сайт недоступен</h1>
  <p>Сайт <span class="host" id="host"></span> закрыт родительским контролем.</p>
  <p>Если он нужен, попросите взрослого открыть его в настройках браузера.</p>
  <div style="margin-top:22px"><a class="btn primary" href="home.html" style="text-decoration:none">На стартовую страницу</a></div>
</div>
<script src="parental.js"></script>
</body>
</html>
