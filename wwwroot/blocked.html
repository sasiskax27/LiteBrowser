<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Сайт заблокирован</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .card { max-width: 560px; margin: 24px; padding: 36px 34px 30px; text-align: center; background: var(--card);
          border: 1px solid rgba(255,120,120,.3); border-radius: 24px; backdrop-filter: blur(14px); }
  .shield { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; font-size: 34px;
            color: var(--bad); background: rgba(255,120,120,.12); box-shadow: 0 0 40px rgba(255,120,120,.25); }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: var(--dim); font-size: 14px; line-height: 1.6; margin: 0 0 8px; }
  .host { color: var(--text); font-weight: 600; word-break: break-all; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
  .link { color: var(--dim); font-size: 13px; text-decoration: underline; background: none; border: 0; cursor: pointer; font: inherit; }
  .link:hover { color: var(--text); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="card">
  <div class="shield icon">&#xEA18;</div>
  <h1>Сайт заблокирован</h1>
  <p>Адрес <span class="host" id="host"></span> есть в списке рекламных, следящих или вредоносных сайтов.</p>
  <p>LiteBrowser остановил переход, чтобы защитить вас.</p>
  <div class="actions">
    <button class="btn primary" id="back">Вернуться назад</button>
    <a class="btn" id="open" style="text-decoration:none">Всё равно открыть</a>
  </div>
</div>
<script src="blocked.js"></script>
</body>
</html>
