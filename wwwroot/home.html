<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Новая вкладка</title>
<link rel="stylesheet" href="common.css">
<style>
  body { display: flex; flex-direction: column; align-items: center; justify-content: safe center; overflow-x: hidden; overflow-y: auto; user-select: none; padding: 24px 0; box-sizing: border-box; }
  .time { font-size: clamp(64px, 11vw, 124px); font-weight: 200; letter-spacing: -3px; line-height: 1;
          background: linear-gradient(180deg, #fff, #b9c3e6); -webkit-background-clip: text; color: transparent; }
  .date { color: var(--dim); font-size: 17px; margin-top: 12px; }
  .hello { font-size: 22px; margin: 6px 0 36px; font-weight: 300; }
  form { width: min(660px, 88vw); position: relative; }
  .search { width: 100%; height: 58px; border-radius: 29px; border: 1px solid var(--line);
            background: rgba(255,255,255,.06); backdrop-filter: blur(14px); color: var(--text);
            font: inherit; font-size: 17px; padding: 0 150px 0 56px; outline: none; transition: .2s; }
  .search:hover { background: rgba(255,255,255,.08); }
  .search:focus { border-color: var(--accent); background: rgba(255,255,255,.09); box-shadow: 0 0 0 5px rgba(124,156,255,.16); }
  .search::placeholder { color: var(--dim); }
  .lens { position: absolute; z-index: 1; pointer-events: none; left: 22px; top: 50%; transform: translateY(-50%); color: var(--dim); font-size: 16px; }
  .engine { position: absolute; z-index: 1; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12.5px; color: var(--dim);
            background: rgba(255,255,255,.07); padding: 7px 14px; border-radius: 16px; text-decoration: none; transition: .2s;
            display: flex; gap: 7px; align-items: center; }
  .engine:hover { color: var(--text); background: rgba(255,255,255,.14); }
  .widgets { display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: min(700px, 92vw); margin-top: 26px; }
  .widgets.show { display: grid; }
  .wg { background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-height: 96px; backdrop-filter: blur(14px); font-size: 13px; position: relative; }
  .wg .big { font-size: 28px; font-weight: 300; line-height: 1.1; }
  .wg .dim { color: var(--dim); font-size: 12px; margin-top: 3px; }
  .wg .row2 { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .wg .up { color: var(--bad); } .wg .down { color: var(--ok); }
  .wg input { font: inherit; font-size: 13px; width: 100%; color: var(--text); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; outline: none; margin-top: 6px; }
  .wg a { color: var(--accent); cursor: pointer; text-decoration: none; font-size: 12px; }
  .wg.note { padding: 0; }
  .wg.note textarea { width: 100%; height: 100%; min-height: 96px; resize: none; border: 0; background: none; color: var(--text); font: inherit; font-size: 13px; padding: 12px 14px; outline: none; }
  .wg .edit { position: absolute; right: 10px; top: 8px; opacity: 0; transition: .15s; }
  .wg:hover .edit { opacity: 1; }
  @media (max-width: 760px) { .widgets.show { grid-template-columns: 1fr; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, 100px); justify-content: center; width: min(700px, 92vw); gap: 12px; margin-top: 44px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 6px 12px; border-radius: 18px;
          text-decoration: none; color: var(--text); font-size: 13px; transition: .2s; }
  .tile:hover { background: rgba(255,255,255,.06); transform: translateY(-3px); }
  .badge { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-weight: 700; font-size: 19px;
           color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .foot { margin-top: 26px; color: var(--dim); font-size: 12.5px; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .foot b { color: var(--ok); font-weight: 600; }
  .foot .off b { color: var(--bad); }
  .private { display: none; margin: -18px 0 30px; padding: 10px 18px; border-radius: 14px; font-size: 13.5px; color: #d9c8ff;
             background: rgba(176,124,255,.12); border: 1px solid rgba(176,124,255,.3); }
  .private.show { display: block; }
  .import { display: none; align-items: center; gap: 14px; margin: -18px 0 28px; padding: 8px 8px 8px 18px; border-radius: 16px; font-size: 13.5px;
            background: rgba(124,156,255,.1); border: 1px solid rgba(124,156,255,.3); }
  .import.show { display: flex; }
  .btn-mini { color: #0d1020; background: linear-gradient(135deg, var(--accent), var(--accent2)); text-decoration: none; font-weight: 600;
              padding: 6px 14px; border-radius: 10px; font-size: 13px; }
  .x { border: 0; background: none; color: var(--dim); cursor: pointer; width: 28px; height: 28px; border-radius: 50%; font-size: 10px; }
  .x:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .tile { position: relative; }
  .tile .rm { position: absolute; top: 4px; right: 10px; width: 22px; height: 22px; border-radius: 50%; border: 0; display: none;
              background: var(--bad); color: #fff; font-size: 9px; cursor: pointer; }
  .editing .tile .rm { display: grid; place-items: center; }
  .editing .tile { animation: wiggle .3s ease-in-out infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
  .tile.add .badge { background: var(--card2) !important; color: var(--dim); font-size: 26px; box-shadow: none; }
  .edit-tiles { margin-top: 14px; border: 0; background: none; color: var(--dim); font: inherit; font-size: 12.5px; cursor: pointer; padding: 6px 12px; border-radius: 10px; }
  .edit-tiles:hover { background: var(--card2); color: var(--text); }
  .edit-tiles .icon { font-size: 11px; margin-right: 4px; }
  body.wall { background-size: cover !important; background-position: center !important; background-attachment: fixed !important; }
  body.wall::before { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: -1; }
  body.wall .glow { display: none; }
  body.wall .time, body.wall .date, body.wall .hello, body.wall .tile, body.wall .foot { text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(3, 100px); } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="time" id="time">--:--</div>
<div class="date" id="date"></div>
<div class="hello" id="hello"></div>
<div class="import" id="import">
  <span>Перенести закладки и историю из другого браузера?</span>
  <a class="btn-mini" href="settings.html#import">Перенести</a>
  <button class="x icon" id="importClose" title="Не показывать">&#xE711;</button>
</div>
<div class="private" id="private">🕶 Режим инкогнито: история, cookies и данные сайтов удалятся, когда вы закроете это окно</div>

<form action="https://lite.home/search" method="get" autocomplete="off">
  <span class="lens icon">&#xE721;</span>
  <input class="search" id="q" name="q" placeholder="Поиск в интернете или адрес сайта" autofocus>
  <a class="engine" id="engine" href="settings.html" title="Сменить поисковую систему"><span class="icon">&#xE713;</span><span id="engineName">…</span></a>
</form>

<div class="tiles" id="tiles"></div>
<button class="edit-tiles" id="editTiles" title="Изменить плитки"><span class="icon">&#xE70F;</span> Изменить</button>

<div class="widgets" id="widgets">
  <div class="wg" id="wgWeather"></div>
  <div class="wg" id="wgMoney"></div>
  <div class="wg note"><textarea id="wgNote" placeholder="Заметка на стартовой странице…" spellcheck="false" maxlength="2000"></textarea></div>
</div>

<div class="foot" id="foot"></div>
<script src="home.js"></script>
</body>
</html>
